<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400">
  <defs>
    <marker id="arrow-red-in" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#D62728"/>
    </marker>
    <marker id="arrow-red-out" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#D62728"/>
    </marker>
  </defs>
  <!-- System boundary -->
  <rect x="150" y="100" width="180" height="200"
        fill="#F9F9F9" stroke="#333" stroke-width="1.5" stroke-dasharray="6,3" rx="4"/>
  <text x="240" y="198" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Impermeable</text>
  <text x="240" y="213" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Layer</text>

  <!-- port_east – heat inlet (left) -->
  <line x1="50" y1="200" x2="150" y2="200" stroke="#D62728" stroke-width="2" marker-end="url(#arrow-red-in)"/>
  <text x="88" y="192" text-anchor="middle" font-family="Arial" font-size="11" fill="#D62728" font-style="italic">Q̇</text>
  <text x="88" y="218" text-anchor="middle" font-family="Arial" font-size="8" fill="#D62728">port_east</text>

  <!-- port_west – heat outlet (right) -->
  <line x1="330" y1="200" x2="430" y2="200" stroke="#D62728" stroke-width="2" marker-end="url(#arrow-red-out)"/>
  <text x="380" y="192" text-anchor="middle" font-family="Arial" font-size="11" fill="#D62728" font-style="italic">Q̇</text>
  <text x="380" y="218" text-anchor="middle" font-family="Arial" font-size="8" fill="#D62728">port_west</text>

  <!-- port_up – heat inlet (top) -->
  <line x1="240" y1="40" x2="240" y2="100" stroke="#D62728" stroke-width="2" marker-end="url(#arrow-red-in)"/>
  <text x="252" y="75" font-family="Arial" font-size="11" fill="#D62728" font-style="italic">Q̇</text>
  <text x="240" y="30" text-anchor="middle" font-family="Arial" font-size="8" fill="#D62728">port_up</text>

  <!-- port_down – heat outlet (bottom) -->
  <line x1="240" y1="300" x2="240" y2="360" stroke="#D62728" stroke-width="2" marker-end="url(#arrow-red-out)"/>
  <text x="252" y="335" font-family="Arial" font-size="11" fill="#D62728" font-style="italic">Q̇</text>
  <text x="240" y="378" text-anchor="middle" font-family="Arial" font-size="8" fill="#D62728">port_down</text>
</svg>
