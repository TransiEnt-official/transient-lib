<svg xmlns="http://www.w3.org/2000/svg" width="380" height="360">
  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#D62728"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7F7F7F"/>
    </marker>
  </defs>
  <!-- System boundary -->
  <rect x="130" y="100" width="120" height="160"
        fill="#F9F9F9" stroke="#333" stroke-width="1.5" stroke-dasharray="6,3" rx="4"/>
  <text x="190" y="178" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">ThermalResistor</text>
  <text x="190" y="193" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold">Vertical_withDisp.</text>

  <!-- port_a – heat inlet (bottom) -->
  <line x1="190" y1="310" x2="190" y2="260" stroke="#D62728" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="202" y="292" font-family="Arial" font-size="11" fill="#D62728" font-style="italic">Q̇</text>
  <text x="190" y="330" text-anchor="middle" font-family="Arial" font-size="8" fill="#D62728">port_a</text>

  <!-- port_b – heat outlet (top) -->
  <line x1="190" y1="100" x2="190" y2="40" stroke="#D62728" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="202" y="75" font-family="Arial" font-size="11" fill="#D62728" font-style="italic">Q̇</text>
  <text x="190" y="30" text-anchor="middle" font-family="Arial" font-size="8" fill="#D62728">port_b</text>

  <!-- q_v – transverse Darcy velocity signal input (left) -->
  <line x1="40" y1="130" x2="130" y2="130" stroke="#7F7F7F" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="78" y="122" text-anchor="middle" font-family="Arial" font-size="11" fill="#7F7F7F" font-style="italic">q</text>
  <text x="84" y="122" font-family="Arial" font-size="8" fill="#7F7F7F">v</text>
  <text x="78" y="145" text-anchor="middle" font-family="Arial" font-size="8" fill="#7F7F7F">q_v</text>
</svg>
